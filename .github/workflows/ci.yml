name: Browser Arena CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-api-tests:
    name: Syntax and API smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check leaderboard.js
          node --check accounts.js
          node --check season.js
          node --input-type=module --check < game.js
      - name: Test server APIs
        run: npm test
