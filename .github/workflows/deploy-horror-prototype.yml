name: Deploy horror prototype to GitHub Pages

# Publishes only the standalone non-combat horror prototype.
on:
  push:
    branches:
      - modern-horror-prototype
    paths:
      - "horror-prototype/**"
      - ".github/workflows/deploy-horror-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R horror-prototype/. _site/
          test -f _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
